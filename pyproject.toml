[project]
name = "sdcard"
version = "0.1.0"
description = "package for managing SD cards"
readme = "README.md"
authors = [
    { name = "Nick Mortimer", email = "nick.mortimer@csiro.au" },
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.14.0,<0.15",
    "rich>=13.0",
    "shellingham>=1.5",
    "click>=8.0,<8.2",
    "pandas>=2.2.0,<3.0",
    "psutil>=5.9.8,<6.0",
    "pyyaml>=6.0,<7.0",
    "jinja2>=3.1.0,<4.0",
    "zstandard>=0.23.0,<0.24",
    "wmi>=1.5.1,<2.0; sys_platform == 'win32'",
    "pywinusb>=0.4.2,<0.5; sys_platform == 'win32'",
]

[project.scripts]
sdcard = "sdcard.main:sdcard"

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdcard"]

[tool.uv]
package = true
